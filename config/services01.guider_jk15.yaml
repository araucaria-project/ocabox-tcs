# Production deployment for services01.oca.lan — jk15 BESO guider +
# colocated thumbnail/UI HTTP server.
#
# Single ``tcsd`` process supervises both services; the framework
# lifecycle handles start order, restarts and monitoring uniformly.
# Symlinked into systemd at ``/etc/systemd/system/oca_guider_jk15.service``
# (see ``deploy/systemd/oca_guider_jk15.service``).
#
# Operator URL: http://services01.oca.lan:8090/
#   - ``/``         → Angular guider UI (single-page dashboard)
#   - ``/thumbs/``  → JPEG thumbnails written by the guiding service
#   - ``/healthz``  → server health JSON
#
# Port 8090 chosen because 8080 on this host is occupied by the
# ``model-stars-presence`` uvicorn service (long-running, do not move).
#
# UI auto-discovers ``base_url`` from the discovery metric; the
# ``base_url_path: /thumbs`` setting below ensures the published URL
# already includes the prefix the routes are mounted under, so the UI
# concatenates it correctly without per-installation tweaking.

nats:
  host: nats.oca.lan
  port: 4222

services:

  # ──────────────────────────────────────────────────────────────────
  # Guiding service — jk15 BESO spectrograph guider.
  # ──────────────────────────────────────────────────────────────────
  - type: guiding_svc.guider
    variant: jk15-guider_beso
    telescope_id: jk15
    subject_prefix: svc
    service_name: guider
    poll_interval_s: 1.0

    tic_conn:
      client_name: CliClient
      software_id: guider/jk15.guider_beso
      enable_observatory: true
      service_mode: true

    cameras:
      - id: guider_beso
        backend:
          type: direct_fetch
          protocol:
            type: alpaca
            prefer_binary: true
            transpose: true
        pipelines:
          - id: mon
            # Default on service restart is `off` — the camera idles, no
            # frames flow, no corrections issued. The operator switches
            # to `monitoring` (frames + solver, no pulses) and then
            # `guiding` from the UI. Rationale: a service restart is
            # rarely intended; if it happens mid-night, the operator
            # discovers the situation by status panel rather than by
            # the mount suddenly executing pulses against a stale
            # anchor. Also frees the camera for a second observer if
            # the guider was restarted opportunistically.
            mode: "off"   # quoted — YAML 1.1 maps bare ``off`` to boolean False
            method: single_star
            selection_policy: closest_excluding_zone

            exp_time: 0.5
            gain: 200
            binning: 1

            # Fibre entrance pixel. History: [938.87, 575.75] (FL2 first
            # calibration) → [945.76, 572.90] measured by S. Kimeswenger
            # 2026-08-03 (post camera-service work); keep in sync with
            # config/guider.jk15.guider_beso.yaml.
            central_point: [945.76, 572.90]
            wide_search_radius_px: 600
            search_reg_px: 30
            stacking_count: 1
            corrections_avg_no: 5
            adu_match_tolerance_per_sec: 200000.0

            method_params:
              fwhm: 3.0
              threshold: 7.0
              saturation_adu: 62000.0
              min_pixels_above_threshold: 5
              centroid_radius_px: 10
              centroid_threshold_sigma: 3.0
              min_smoothed_sigma: 3.0
              max_concentration: 0.5
              rank_by: aperture

            # Method-specific param sets. The Controller swaps the method
            # at runtime via set_state({"method": "fiber_photocentroid",
            # "method_params": {...}}) — UI dispatches when operator picks
            # a method in the radio. Keep these blocks here so the UI
            # (or a future "preset" picker) can load the right defaults
            # when switching. Not consumed automatically; informational
            # for now.
            fiber_method_params:
              fiber_radius_px: 5.0           # geometric hole radius (px)
              analysis_radius_px: 15.0       # window half-size around reticle
              adu_sigma_threshold: 3.0       # detection gate (σ above bg)
              hole_zone_factor: 2.0          # legacy ramp end (unused while dead_zone_px set)
              saturation_adu: 62000.0        # same as single_star — clip plateau
              # Dead zone decoupled from the hole radius. The legacy dead
              # zone spans the full fiber_radius_px (5 px apparent ≈ 3.4 px
              # real — the photocentroid over-reports offsets ~1.5×), which
              # silences the loop over offsets that already cost real
              # coupling AND makes refine-reticle a no-op for few-px
              # drifts. 2.0 px apparent ≈ 1.3 px real. Rollback without
              # restart: patch method_params with dead_zone_px: null.
              dead_zone_px: 2.0

            pulse_guide:
              jacobian:
                kE_x_px_per_ms: -0.00043
                kE_y_px_per_ms:  0.03895
                kN_x_px_per_ms:  0.03911
                kN_y_px_per_ms:  0.00099
              damping_alpha: 0.5
              # Pulse max ≈ wide-search radius (~0.04 px/ms × 5000ms = 200 px).
              # With Phase-2 timing the solver waits for the settle window
              # before re-acquiring, so a longer single pulse no longer
              # creates "miss frames" that burn the budget. Bigger pulses
              # also mean drop-to-reticle / large-correction slews converge
              # in fewer cycles instead of N×damping_alpha geometric crawl.
              duration_max_ms: 5000
              duration_min_ms: 20
              # Below-min handling: ``stochastic`` (default) fires a
              # ``min_pulse_ms`` pulse with probability ``calc/min``,
              # so on average the mount sees ``calc·J`` motion even when
              # individual frames want sub-min pulses. Cures the fiber
              # "windrose chart points clustered on one side of zero"
              # symptom that ``skip`` produces by silently dropping
              # every small drift. Alternatives: ``skip`` (legacy,
              # always-drop) or ``snap_half`` (deterministic round-up).
              min_pulse_policy: stochastic
              post_pulse_settle_ms: 600

            # Reticle-target detector: measures the fibre entrance in the
            # image (a dark disk inside the halo) so the reticle can be
            # re-referenced to a measurement via "refine reticle" in the
            # UI. Runs in every mode and with every method, and only ever
            # *offers* a refinement — it never moves anything by itself.
            hole_detect:
              enabled: true
              # radius_px inherits fiber_radius_px (5.0) below. Note it is
              # a precision constant here — 1 px of error costs 1.2–1.9 px
              # of reported position — unlike its dead-zone role, which
              # tolerates ~20 %. Worth measuring on an illuminated frame
              # and setting explicitly.
              # Search radius sized to the drift actually seen on this
              # telescope (single-digit px). Widening it raises the rate
              # of spurious maxima, which appear on the boundary.
              search_radius_px: 12.0
              min_snr: 6.0
              min_samples: 5             # consistent frames before offering
              max_scatter_px: 1.5
              refine_max_offset_px: 10.0 # beyond this: refuse, verify by eye

            # These four flags currently have NO EFFECT: they are parsed
            # into PipelineState and read by nothing, because the pipeline
            # has no FITS writer (GuiderPaths is never instantiated;
            # guider_ofp.py is unimported legacy code). Image retention is
            # governed solely by the ``thumbnails`` block below.
            save_raw_fits: false
            save_stacked_fits: false
            save_raw_thumbnails: false
            save_stacked_thumbnails: false

            thumbnails:
              enabled: true
              # Match the thumbnail server's mounted directory below.
              output_dir: /storage/poweruser/thumbs/guider
              # Half-resolution: 968×608 ≈ 250 KB JPEGs (vs ~1.9 MB at
              # full-res). Operators on VPN couldn't keep up with the
              # 4 fps cadence at the full size — each fetch took longer
              # than the gap between frames, image stayed frozen
              # despite metadata advancing. Sub-pixel star positions
              # in the UI come from the solver (which sees the full
              # 1936 sensor), so overlay accuracy is unaffected;
              # operator just gets a softer bitmap when they zoom.
              size: [968, 608]
              every_n: 1
              latest_link: true
              # High quality on purpose: JPEG ringing around the fibre-hole
              # rim is the only compression term in the hole-position error
              # budget. ~380 KB/frame ≈ 0.3 MB/s to a live viewer at this
              # cadence, well under what stalls a VPN client.
              quality: 92
              # Sized to hold a whole observing night (~14 h at ~0.8 fps),
              # so frames can be reviewed after the fact; ~15 GB worst
              # case against ~89 GB free on /storage. A few hundred files
              # covers only minutes and is effectively no history at all.
              max_files: 40000

  # ──────────────────────────────────────────────────────────────────
  # Thumbnail HTTP server — also serves the Angular UI from the same
  # port. ``base_url_path: /thumbs`` lets the UI concatenate the
  # discovered base URL with thumbnail paths without ambiguity, while
  # ``index_file`` makes ``/`` deliver the SPA's index.html.
  # ──────────────────────────────────────────────────────────────────
  - type: thumbnail_svc.server
    # The thumbnail server is per-filesystem — exactly one runs on each
    # host that hosts guiders, regardless of how many telescopes write
    # into its directory. The natural identifier is therefore the host
    # name. Currently ``services01-jk15`` (kept for now since this is
    # also today's only-jk15 deploy); when zb08 / others land on this
    # host the variant should drop the telescope suffix → ``services01``
    # so a single thumbnail server serves all colocated guiders.
    variant: services01-jk15
    bind: 0.0.0.0
    port: 8090
    # IP, not hostname. The operator may connect from outside the
    # observatory LAN (VPN), where ``services01.oca.lan`` is not
    # resolvable — DNS for ``oca.lan`` lives only on the internal
    # gateway. Discovery messages publish this string verbatim into
    # ``base_url``, and the UI relies on it being a name the browser
    # can resolve. IP works for both LAN and VPN clients.
    public_host: 192.168.7.45
    base_url_path: /thumbs
    index_file: /home/poweruser/src/ocabox-guider-ui/dist/ocabox-guider-ui/browser/index.html
    cache_max_age_s: 1
    cors_origin: "*"

    # Order matters: more-specific (longer) prefix first so aiohttp
    # matches ``/thumbs/...`` against the thumbnails before falling
    # through to the SPA root mount.
    roots:
      - prefix: /thumbs
        directory: /storage/poweruser/thumbs/guider
      - prefix: /
        directory: /home/poweruser/src/ocabox-guider-ui/dist/ocabox-guider-ui/browser
