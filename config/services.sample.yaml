# Sample configuration for ocabox-tcs services
# Copy this file to services.yaml and customize for your deployment

nats:
  host: localhost
  port: 4222
  required: true  # Block startup until NATS is available
  # required: false  # For development: continue without NATS

# Registry: maps service_type to Python module path
# - null (~) means internal service: ocabox_tcs.services.{type}
# - explicit path for external packages
registry:
  hello_world: ~                              # -> ocabox_tcs.services.hello_world
  # examples.minimal: ~                       # -> ocabox_tcs.services.examples.01_minimal
  # halina.server: halina.server.halina_server  # External package example
  # tic_bridge_svc.tic_bridge: ~              # -> ocabox_tcs.services.tic_bridge_svc.tic_bridge
  # optics: ~                                 # -> ocabox_tcs.services.optics

# Service instances to launch
services:
  # Hello World - canonical example service
  - type: hello_world
    variant: main
    interval: 5
    message: "Hello World!"
    log_level: INFO

  # Uncomment to run multiple instances
  # - type: hello_world
  #   variant: dev
  #   interval: 3
  #   message: "Dev instance"

  # External service from external Python package
  # Uncomment to test external service discovery (requires external_example package)
  # - type: external_worker
  #   variant: demo

  # TIC Bridge — forwards NATS messages to TIC (ocabox-server)
  #   tic.command.<tel>.<component>.<command>  (fire-and-forget PUT)
  #   tic.rpc.<tel>.<component>.<command>      (request/response; method=GET by default)
  # Payload: {"parameters": {...}, "client_id": "...", "request_timeout": 5.0, "method": "GET"}
  # - type: tic_bridge_svc.tic_bridge
  #   variant: main
  #   log_level: INFO
  #   # tic_host: ""                  # omit to load from obs_config_stream
  #   # tic_port: 0                   # omit to load from obs_config_stream
  #   obs_config_stream: tic.config.observatory
  #   default_client_name: ""         # blank → service id
  #   max_clients: 20
  #   client_ttl: 3600.0
  #   default_request_timeout: 5.0
  #   command_prefix: tic.command
  #   rpc_prefix: tic.rpc
  #   enable_command: true
  #   enable_rpc: true

  # Optics — what each instrument sees, and light-path switching (one instance per telescope;
  # needs the `optics` extra). Clients reach it through TIC (ocabox-server TreeNatsService):
  #   status.optics.<tel>.<detector>.{sees,functions}, status.optics.<tel>.self.{selectors,busy,operation}
  #   rpc.optics.<tel>.<detector>.setpath  {"function": "object"}
  #   rpc.optics.<tel>.self.{confirm,reject,abort}  {"operation": "<id>"}; journal tic.journal.<tel>.optics
  # - type: optics
  #   variant: jk15                   # the telescope id (or set `telescope:`)
  #   interval: 1.0                   # T1 of the TIC subscriptions: how fresh every value is kept, s
  #   max_age: ~                      # T2: older proves nothing (default 2*T1, at least 5 s)
  #   recompute: 10.0                 # s between recomputations without a delivery (sky, declarations)
  #   actuate: [tertiary, covercalibrator, covercalibrator.calibrator, dome]  # state keys the service may move (dome: to the flat screen only)
  #   declaration_hours: 12.0         # an operator's declaration nobody withdrew expires after this
  #   prove_timeout: 60.0             # s for a commanded move to be proven by a reading (longer when slew_timeout says so)
  #   confirm: {}                     # moves that wait for a person beyond the floor (dome always, covers by day): {key: always | day}
  #   confirm_timeout: 120.0          # s such a move waits for a person before it expires
  #   components_file: ""             # config.yaml to try a graph before it is published
  #   client_name: CliClient          # ocabox client section of the observatory configuration

# For tutorial examples, see config/examples.yaml
# To learn the framework, see src/ocabox_tcs/services/examples/README.md
