name: Tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [offline, nats]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: python -m pip install poetry==2.3.3
      - name: Install dependencies
        run: poetry install --all-extras --no-interaction
      - name: Run tests without NATS
        if: matrix.group == 'offline'
        run: poetry run pytest
      - name: Start NATS with JetStream
        if: matrix.group == 'nats'
        run: docker run --detach --name nats --publish 4222:4222 nats:2.10-alpine --jetstream
      - name: Run NATS integration tests
        if: matrix.group == 'nats'
        run: poetry run pytest -m nats
