[tool.poetry]
name = "ocabox-tcs"
version = "1.3.1"
description = "Telescope Control Services for OCABOX Astronomical Observatory Server"
authors = ["Mikolaj et.al.", "Claude Code <noreply@anthropic.com>"]
readme = "README.md"
packages = [
    {include = "ocabox_tcs", from = "src"},
    {include = "tcsctl", from = "src"},
    # auto_adjust — universal, application-agnostic toolkit for online
    # parameter learning. Shipped here for development convenience;
    # earmarked for extraction to its own public repository when the API
    # has settled and a second consumer materialises. See
    # src/auto_adjust/README.md.
    {include = "auto_adjust", from = "src"},
]
repository = "https://github.com/araucaria-project/ocabox-tcs"

[tool.poetry.dependencies]
python = "^3.10"
serverish = {version = "^2.0.1", extras = ["messenger"]}  # for NATS
ocabox = {git = "https://github.com/araucaria-project/ocabox.git", optional = true}
python-dotenv = "^1.0.0"  # For .env file support
numpy = "^1.26"  # arrays — needed by guiding_svc and auto_adjust
# CLI dependencies are optional (install with: pip install ocabox-tcs[cli])
typer = {version = "^0.19.2", optional = true}  # CLI framework
rich = {version = "^13.0.0", optional = true}  # For colorful terminal output
textual = {version = "^0.40.0", optional = true}  # For future monitor mode
pyyaml = "^6.0.3"
# Optional extras for specific guider/auto_adjust features
astropy = {version = "^6.0", optional = true}  # FITS reading in FileSimProtocol; required by Stacker once calibration lands
aiohttp = {version = "^3.9", optional = true}  # direct Alpaca imagebytes fetch (DirectFetchBackend + AlpacaProtocol)
pillow = {version = "^10.0", optional = true}  # JPEG encoding for thumbnail_emitter; star-cutout previews in solver methods
padasip = {version = "^1.2", optional = true}  # auto_adjust RLSAdapter
scikit-learn = {version = "^1.4", optional = true}  # auto_adjust GPAdapter

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
ruff = "^0.13.2"
# CLI dependencies for development
typer = "^0.19.2"
rich = "^13.0.0"

[tool.poetry.scripts]
tcs_process = "ocabox_tcs.launchers.process:main"
tcs_asyncio = "ocabox_tcs.launchers.asyncio:main"
tcsd = "ocabox_tcs.launchers.tcsd:main"
tcsctl = "tcsctl.app:main"

[tool.poetry.extras]
cli = ["typer", "rich", "textual"]  # CLI tools (tcsctl command)
oca = ["ocabox"]  # OCABOX integration, running ocabox dependent services
guider = ["astropy", "aiohttp", "pillow"]  # full guiding_svc dependencies (FITS reading, stacking math, direct Alpaca fetch, JPEG thumbnail encoding)
adjust-rls = ["padasip"]  # auto_adjust RLSAdapter
adjust-gp = ["scikit-learn"]  # auto_adjust GPAdapter

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# By default, skip tests marked as 'manual' (require external services)
# To run manual tests: pytest -m manual
addopts = "-m 'not manual'"
markers = [
    "manual: marks tests that require external services (deselect with '-m \"not manual\"')",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
# Target Python 3.10
target-version = "py310"
line-length = 100

# Don't check these directories
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    ".eggs",
]

[tool.ruff.lint]
# Select gentle rules that catch real issues (non-annoying for astronomers)
select = [
    "F",   # Pyflakes - real errors (unused imports, undefined names)
    "E4",  # Import-related errors
    "E7",  # Statement errors
    "E9",  # Runtime errors
    "I",   # isort - import sorting (auto-fixable)
    "UP",  # pyupgrade - modern Python syntax (auto-fixable)
    "B",   # flake8-bugbear - bug-prone patterns
]

# Ignore annoying rules
ignore = [
    "E501",   # Line too long (black handles this)
    "B008",   # Function call in argument defaults (common in decorators)
    "B904",   # raise from - often not needed in simple code
]

# Allow auto-fixing
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Tests can have unused imports, fixtures, etc.
"tests/**/*.py" = ["F401", "F811"]
# Examples should be simple and clear
"src/ocabox_tcs/services/examples/*.py" = ["B"]

[tool.ruff.lint.isort]
# Use black-compatible import sorting
force-single-line = false
lines-after-imports = 2
